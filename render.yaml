services:
  - type: web
    name: shuleni-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && gunicorn shuleni.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: DB_NAME
        value: /var/data/db.sqlite3
      - key: CORS_ALLOWED_ORIGINS
        value: https://shuleni-frontend-three.vercel.app
    disk:
      name: shuleni-data
      mountPath: /var/data
      sizeGB: 1